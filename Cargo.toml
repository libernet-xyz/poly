[package]
name = "starkom-poly"
version = "4.5.3"
description = "Algorithms over polynomials used in Starkom (NTT, Lagrange interpolation, etc.)."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/poly.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
starkom-ff = "3.4.0"

[dev-dependencies]
starkom-bluesky = "3.6.1"
